<!DOCTYPE html>
<html>
<head>
    <title>Report Item - Campus Lost & Found</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; background: #f4f4f9; display: flex; justify-content: center; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        label { font-weight: bold; color: #333; }
        
        button { width: 100%; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-submit { background: #28a745; color: white; font-size: 16px; }
        .btn-submit:hover { background: #218838; }
        .btn-location { background: #007bff; color: white; margin-bottom: 10px; }
        .btn-location:hover { background: #0056b3; }
        
        /* Proactive Match & AI Alert Boxes */
        #ai-results { padding: 15px; background: #e8f0fe; border-radius: 8px; display: none; margin-bottom: 15px; }
        .tag { display: inline-block; background: #1a73e8; color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; margin: 3px; }

        #match-alert { padding: 15px; background: #fff3cd; border-left: 5px solid #ffc107; border-radius: 8px; display: none; margin-bottom: 15px; }
        .match-card { background: white; padding: 15px; margin-top: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .btn-inspect { background: #17a2b8; color: white; padding: 8px; margin-top: 10px; }
        .btn-inspect:hover { background: #138496; }

        /* Integrated 360 Viewer Modal (The Popup) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background-color: #222; margin: auto; padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; text-align: center; position: relative; color: white; }
        .close-btn { color: white; position: absolute; top: 10px; right: 20px; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #ff4444; }
        #modal-image { width: 100%; max-width: 400px; height: 400px; object-fit: cover; border-radius: 8px; cursor: ew-resize; user-select: none; background: #333; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin-top: 0;">📢 Report an Item</h2>
        
        <label>Item Type</label>
        <select id="item_type" onchange="toggleLocationUI()">
            <option value="Lost">I Lost Something</option>
            <option value="Found">I Found Something</option>
        </select>

        <label>Title</label>
        <input type="text" id="title" placeholder="e.g., Black Laptop Bag">

        <label>Description</label>
        <textarea id="description" rows="2" placeholder="Any scratches or details?"></textarea>

        <label>📷 Upload Photos (Max 6)</label>
        <input type="file" id="imageFiles" multiple accept="image/*">

        <!-- GPS Section (Hidden by default, shows only for "Found") -->
        <div id="location-section" style="display: none; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd;">
            <label>📍 Where did you find it?</label>
            <p style="font-size: 12px; color: #666; margin: 5px 0 10px 0;">Help the owner by pinning the exact location.</p>
            <button type="button" class="btn-location" onclick="getLocation()">Get My GPS Coordinates</button>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="lat" placeholder="Latitude" readonly style="margin:0;">
                <input type="number" id="lng" placeholder="Longitude" readonly style="margin:0;">
            </div>
        </div>

        <button class="btn-submit" onclick="submitFullReport()">Submit Report</button>
        <div id="status-message" style="margin-top:15px; text-align:center; font-weight:bold;"></div>

        <!-- AI Image Recognition Box -->
        <div id="ai-results" style="margin-top: 15px;">
            <p style="margin:0 0 10px 0;"><b>🤖 AI Object Recognition:</b></p>
            <div id="tag-container"></div>
        </div>

        <!-- Proactive Match Alert Box -->
        <div id="match-alert" style="margin-top: 15px;">
            <h3 style="margin: 0 0 5px 0; color: #856404;">⚠️ Wait! Is this yours?</h3>
            <p style="margin: 0 0 10px 0; font-size: 14px; color: #666;">We found items in the database that match your description.</p>
            <div id="matches-list"></div>
        </div>
    </div>

    <!-- The 360° Viewer Modal -->
    <div id="viewer-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeViewer()">&times;</span>
            <h3 style="margin-top: 0;">🔍 360° Inspection</h3>
            <p style="color: #aaa; font-size: 14px;">↔️ Click and drag the image left or right</p>
            <img id="modal-image" draggable="false" src="">
            <p id="modal-loading" style="display:none; color: yellow;">Loading images...</p>
        </div>
    </div>

    <script>
        // --- UX Fix 1: Toggle GPS UI based on Item Type ---
        function toggleLocationUI() {
            const itemType = document.getElementById("item_type").value;
            const locSection = document.getElementById("location-section");
            if (itemType === "Found") {
                locSection.style.display = "block"; // Show GPS
            } else {
                locSection.style.display = "none";  // Hide GPS
                // Clear the GPS data so we don't accidentally send it
                document.getElementById("lat").value = "";
                document.getElementById("lng").value = "";
            }
        }
        
        // Run once on load to set initial state
        toggleLocationUI();

        // --- Core GPS Logic ---
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById("lat").value = pos.coords.latitude;
                    document.getElementById("lng").value = pos.coords.longitude;
                });
            } else {
                alert("GPS not supported by this browser.");
            }
        }

        // --- Core Submit Logic ---
        async function submitFullReport() {
            const status = document.getElementById("status-message");
            const itemType = document.getElementById("item_type").value;
            
            document.getElementById("ai-results").style.display = "none";
            document.getElementById("match-alert").style.display = "none";
            
            status.innerText = "Processing Text & GPS... ⏳";
            status.style.color = "blue";

            const itemData = {
                title: document.getElementById("title").value,
                description: document.getElementById("description").value,
                item_type: itemType,
                latitude: parseFloat(document.getElementById("lat").value) || null,
                longitude: parseFloat(document.getElementById("lng").value) || null
            };

            try {
                const itemResponse = await fetch("http://127.0.0.1:8000/items/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(itemData)
                });
                const newItem = await itemResponse.json();
                const itemId = newItem.id;

                const fileInput = document.getElementById("imageFiles");
                if (fileInput.files.length > 0) {
                    status.innerText = "Analyzing Images with AI... 🤖";
                    const formData = new FormData();
                    for (let file of fileInput.files) { formData.append("files", file); }

                    const imgResponse = await fetch(`http://127.0.0.1:8000/items/${itemId}/images/`, {
                        method: "POST",
                        body: formData
                    });
                    const imgData = await imgResponse.json();

                    if (imgData.ai_analysis && imgData.ai_analysis.length > 0) {
                        document.getElementById("ai-results").style.display = "block";
                        const tagContainer = document.getElementById("tag-container");
                        tagContainer.innerHTML = "";
                        imgData.ai_analysis[0].ai_tags.forEach(tag => {
                            tagContainer.innerHTML += `<span class="tag">${tag}</span>`;
                        });
                    }
                }

                if (itemType === "Lost") {
                    status.innerText = "Scanning campus for your lost item... 🔍";
                    const matchRes = await fetch(`http://127.0.0.1:8000/items/${itemId}/matches/`);
                    const matchData = await matchRes.json();
                    const strongMatches = matchData.ai_predictions.filter(m => m.confidence_score >= 70);
                    
                    if (strongMatches.length > 0) {
                        const matchesList = document.getElementById("matches-list");
                        matchesList.innerHTML = "";
                        strongMatches.forEach(m => {
                            // Print exactly what the server sent so we can debug it
                            console.log("Match Data from Server:", m);

                            // Force the description to appear
                            let descText = "No description provided.";
                            if (m.matched_description && m.matched_description.trim() !== "") {
                                descText = m.matched_description;
                            }

                            // Build a Google Maps button if GPS data exists
                            let locationBtn = "";
                            if (m.latitude && m.longitude) {
                                locationBtn = `<button class="btn-location" style="margin-top: 10px; width: 48%; margin-left: 4%;" onclick="window.open('https://www.google.com/maps?q=${m.latitude},${m.longitude}', '_blank')">📍 View Map</button>`;
                            } else {
                                locationBtn = `<span style="font-size: 12px; color: #999; margin-left: 10px;">(No GPS data)</span>`;
                            }

                            matchesList.innerHTML += `
                                <div class="match-card">
                                    <div style="font-weight: bold; font-size: 16px; color: #333;">
                                        [Item #${m.matched_item_id}] ${m.matched_title}
                                    </div>
                                    
                                    <!-- Description Area -->
                                    <div style="color: #444; font-size: 14px; margin: 10px 0; padding: 8px; background: #f8f9fa; border-left: 4px solid #1a73e8; border-radius: 4px;">
                                        <b>📝 Details:</b> ${descText}
                                    </div>

                                    <div style="color: #155724; font-size: 13px; font-weight: bold; margin: 5px 0;">
                                        🤖 ${m.confidence_score}% AI Match
                                    </div>
                                    
                                    <!-- Side-by-side Buttons -->
                                    <div style="display: flex; align-items: center;">
                                        <button class="btn-inspect" style="width: 48%; margin-top: 10px;" onclick="openViewer(${m.matched_item_id})">🔍 Inspect 360°</button>
                                        ${locationBtn}
                                    </div>
                                </div>
                            `;
                        });
                        document.getElementById("match-alert").style.display = "block";
                        status.innerText = "✅ Report saved. Please check the potential matches below!";
                        status.style.color = "green";
                    } else {
                        status.innerText = "✅ Report saved! We will notify you if it turns up.";
                        status.style.color = "green";
                    }
                } else {
                    status.innerText = "✅ Thank you! Found Item Report Saved.";
                    status.style.color = "green";
                }
            } catch (err) {
                status.innerText = "❌ Error connecting to server.";
                status.style.color = "red";
            }
        }

        // --- UX Fix 2: Integrated 360 Viewer Modal Logic ---
        let viewerImages = [];
        let currentIndex = 0;
        let isDragging = false;
        let startX = 0;
        const imgElement = document.getElementById("modal-image");
        const modal = document.getElementById("viewer-modal");

        async function openViewer(itemId) {
            // THE FIX: Completely empty out the old images!
            viewerImages = []; 
            
            document.getElementById("modal-loading").style.display = "block";
            document.getElementById("modal-loading").innerText = "Loading images...";
            imgElement.src = ""; // Clear old image
            modal.style.display = "flex"; // Show popup
            
            try {
                const response = await fetch(`http://127.0.0.1:8000/items/${itemId}/images/`);
                const data = await response.json();
                
                if (data.images && data.images.length > 0) {
                    viewerImages = data.images.map(path => `http://127.0.0.1:8000${path}`);
                    currentIndex = 0;
                    imgElement.src = viewerImages[0];
                    document.getElementById("modal-loading").style.display = "none";
                } else {
                    document.getElementById("modal-loading").innerText = "No photos were uploaded for this item.";
                }
            } catch (e) {
                document.getElementById("modal-loading").innerText = "Error loading images.";
            }
        }

        function closeViewer() {
            modal.style.display = "none";
            isDragging = false; // Reset drag state safely
        }

        // 360 Drag Listeners
        imgElement.addEventListener('mousedown', (e) => { isDragging = true; startX = e.pageX; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging || viewerImages.length === 0) return;
            let dragDistance = e.pageX - startX;
            if (Math.abs(dragDistance) > 20) {
                if (dragDistance > 0) { currentIndex = (currentIndex + 1) % viewerImages.length; } 
                else { currentIndex = (currentIndex - 1 + viewerImages.length) % viewerImages.length; }
                imgElement.src = viewerImages[currentIndex];
                startX = e.pageX;
            }
        });
    </script>
</body>
</html>
